  <script>
    let allFlashcards = {{ flashcards | tojson }};
    let flashcards = allFlashcards.slice();
    let currentIndex = 0;
    let showingFront = true;
    let editMode = false;
    let focusMode = false;
    let mistakesHistoryVisible = true; // Track visibility of mistakes history

    // Variables for jump search
    let jumpSearchTerm = "";
    let jumpSearchResults = [];
    let jumpSearchCurrentIndex = 0;

    window.onload = function() {
      ensureCardProperties();
      loadStateFromLocalStorage();
      updateThemeMenuItem();
      renderCard();
      setupIncorrectModal();
      setupMoveToModal(); // Initialize move to modal
      updateMistakesHistoryVisibility(); // Apply history visibility
      initMobileHandlers(); // Initialize mobile touch and UI handlers
      
      // "Absolutely required" star in the card header
      document.getElementById("required-toggle").addEventListener("click", toggleRequired);
      
      // Set up event listeners for move buttons
      document.getElementById("move-up").addEventListener("click", moveCardUp);
      document.getElementById("move-down").addEventListener("click", moveCardDown);
      document.getElementById("move-to").addEventListener("click", showMoveToModal);
    };
    
    // Ensure all cards have the required properties (NEW)
    function ensureCardProperties() {
      ensureAttemptsExist();
      
      // Make sure all cards have the absolutelyRequired property
      allFlashcards.forEach(card => {
        if (card.absolutelyRequired === undefined) {
          card.absolutelyRequired = false;
        }
      });
    }
    
    // Function to toggle mistakes history visibility
    function toggleMistakesHistoryVisibility() {
      mistakesHistoryVisible = !mistakesHistoryVisible;
      updateMistakesHistoryVisibility();
      saveStateToLocalStorage();
    }
    
    // Function to update visibility based on state
    function updateMistakesHistoryVisibility() {
      const historyDiv = document.getElementById("incorrect-attempts-history");
      document.getElementById("history-toggle").classList.toggle("active", mistakesHistoryVisible);
      document.querySelectorAll(".history-label").forEach(el => {
        el.textContent = mistakesHistoryVisible ? "Hide mistakes" : "Show mistakes";
      });
      
      // Base visibility on mistakesHistoryVisible setting
      if (!mistakesHistoryVisible) {
        historyDiv.style.display = "none";
        return;
      }
      
      // In focus mode, only show history when viewing the back of the card
      if (focusMode) {
        historyDiv.style.display = showingFront ? "none" : "block";
      } else {
        // In normal mode, show history for both sides if enabled
        historyDiv.style.display = "block";
      }
    }

    function setupIncorrectModal() {
      const modal = document.getElementById("incorrect-modal");
      const submitBtn = document.getElementById("incorrect-submit");
      const cancelBtn = document.getElementById("incorrect-cancel");
      const input = document.getElementById("incorrect-reason");

      submitBtn.addEventListener("click", function() {
        const reason = input.value.trim();
        recordAttempt(false, reason);
        closeIncorrectModal();
        // Advance to next card after marking incorrect
        if (currentIndex < flashcards.length - 1) {
          currentIndex++;
          showingFront = true;
          renderCard();
          saveStateToLocalStorage();
        }
      });

      cancelBtn.addEventListener("click", function() {
        closeIncorrectModal();
        // Do not record attempt or advance when canceled
      });

      // Allow pressing Enter to submit
      input.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
          e.preventDefault();
          submitBtn.click();
        }
      });

      // Close modal if clicking outside
      window.addEventListener("click", function(e) {
        if (e.target === modal) {
          closeIncorrectModal();
          // Do not record attempt or advance when canceled
        }
      });
    }

    function showIncorrectModal() {
      const modal = document.getElementById("incorrect-modal");
      const input = document.getElementById("incorrect-reason");
      input.value = "";
      modal.style.display = "block";
      setTimeout(() => input.focus(), 100);
    }

    function closeIncorrectModal() {
      const modal = document.getElementById("incorrect-modal");
      modal.style.display = "none";
    }

    function saveStateToLocalStorage() {
      const state = {
        tagFilter: document.getElementById("tag-filter").value,
        searchInput: document.getElementById("search-input").value,
        requiredFilter: document.getElementById("required-filter").value, // NEW
        focusMode: focusMode,
        theme: document.documentElement.dataset.theme,
        currentIndex: currentIndex,
        mistakesHistoryVisible: mistakesHistoryVisible
      };
      localStorage.setItem('flashcardState', JSON.stringify(state));
    }

    function loadStateFromLocalStorage() {
      const stateJson = localStorage.getItem('flashcardState');
      if (!stateJson) return;
      
      try {
        const state = JSON.parse(stateJson);
        document.getElementById("tag-filter").value = state.tagFilter || '';
        document.getElementById("search-input").value = state.searchInput || '';
        
        // Set the required filter dropdown value (NEW)
        if (state.requiredFilter) {
          document.getElementById("required-filter").value = state.requiredFilter;
        }
        
        applyCurrentFilter();
        if (state.currentIndex !== undefined && flashcards.length > 0) {
          currentIndex = Math.min(state.currentIndex, flashcards.length - 1);
          if (currentIndex < 0) currentIndex = 0;
        }
        if (state.focusMode) {
          focusMode = false;
          toggleFocusMode();
        }
        if (state.mistakesHistoryVisible !== undefined) {
          mistakesHistoryVisible = state.mistakesHistoryVisible;
          updateMistakesHistoryVisibility();
        }
        renderCard();
      } catch (error) {
        console.error("Error loading state from localStorage:", error);
      }
    }

    function toggleFocusMode() {
      focusMode = !focusMode;
      document.body.classList.toggle("focus", focusMode);
      document.getElementById("focus-mode-toggle").classList.toggle("active", focusMode);
      closePopovers();
      updateMistakesHistoryVisibility();
      saveStateToLocalStorage();
    }

    function toggleDarkMode() {
      applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
      updateThemeMenuItem();
      closePopovers();
      saveStateToLocalStorage();
    }

    function updateThemeMenuItem() {
      const dark = document.documentElement.dataset.theme === "dark";
      document.querySelectorAll(".theme-label").forEach(el => el.textContent = dark ? "Light mode" : "Dark mode");
      document.querySelectorAll(".theme-icon").forEach(el => el.textContent = dark ? "light_mode" : "dark_mode");
    }

    // ===== Shortcuts & help =====
    // Single source for the help panel: keep in sync with the keydown handler below.
    const SHORTCUTS = [
      { group: "Studying", items: [
        [["←", "→"], "Previous / next card"],
        [["Space", "↑", "↓"], "Flip card"],
        [["c"], "Mark correct and go to the next card"],
        [["x"], "Mark incorrect (asks what you got wrong)"],
      ]},
      { group: "Modes and views", items: [
        [["f"], "Focus mode on / off"],
        [["t"], "Dark mode on / off"],
        [["e"], "Edit mode on / off"],
        [["h"], "Show / hide previous mistakes"],
        [["?"], "This help"],
      ]},
      { group: "Current card", items: [
        [["r"], "Toggle “Absolutely required”"],
        [["m"], "Move card to a position"],
        [["⌘/Ctrl", "C"], "Copy card (front and back) to the clipboard"],
        [["Ctrl", "R"], "Clear this card’s attempt history (asks first)"],
      ]},
      { group: "While editing", items: [
        [["a"], "Add a card after this one"],
        [["d"], "Delete this card (asks first)"],
        [["s"], "Save edits"],
        [["⌘/Ctrl", "V"], "In front/back: paste an image (e.g. a screenshot) to upload and embed it at the cursor"],
      ]},
      { group: "Anywhere", items: [
        [["Esc"], "Leave a text box, or close a panel / menu"],
        [["Enter"], "In “Jump to card”: go to the next match; in filters: apply"],
      ]},
    ];
    const TOUCH = [
      [["Tap card"], "Flip card"],
      [["Swipe ← →"], "Next / previous card"],
      [["✕", "✓"], "Mark incorrect / correct (bottom bar)"],
      [["⋮"], "Edit, mistakes, copy, focus, dark mode, clear attempts"],
    ];
    const MODES = [
      ["Study", "the default: card, stats, tags and previous mistakes."],
      ["Focus", "hides everything but the card; previous mistakes show only on the back. Leave with f or the focus button."],
      ["Edit", "the card becomes editable and the bar turns into an edit toolbar (move, add, delete, Done)."],
      ["Filters", "narrow the deck by content, tags (type them or check them off in the tag list; all must match) and “Absolutely required”; active filters show as removable chips under the bar."],
    ];

    function renderHelp() {
      const kbd = keys => keys.map(k => `<kbd>${k}</kbd>`).join("");
      const rows = items => items.map(([keys, text]) =>
        `<div class="help-row"><span class="help-keys">${kbd(keys)}</span><span>${text}</span></div>`).join("");
      document.getElementById("help-body").innerHTML =
        `<div class="help-group cb-mobile"><h4>Touch</h4>${rows(TOUCH)}</div>` +
        SHORTCUTS.map(g => `<div class="help-group cb-desktop"><h4>${g.group}</h4>${rows(g.items)}</div>`).join("") +
        `<div class="help-group"><h4>Modes</h4>${MODES.map(([name, text]) =>
          `<div class="help-mode"><b>${name}</b>: ${text}</div>`).join("")}</div>`;
    }

    function toggleHelp(show) {
      const modal = document.getElementById("help-modal");
      const open = show === undefined ? modal.style.display !== "block" : show;
      if (open) renderHelp();
      modal.style.display = open ? "block" : "none";
    }

    // ===== Command bar =====
    function setEditMode(on) {
      editMode = on;
      if (!editMode) showingFront = true;
      document.body.classList.toggle("editing", editMode);
      closePopovers();
      renderCard();
    }

    function closePopovers() {
      document.body.classList.remove("filters-open", "menu-open");
      document.getElementById("filter-toggle").setAttribute("aria-expanded", "false");
      document.getElementById("menu-toggle").setAttribute("aria-expanded", "false");
    }

    function togglePopover(cls, buttonId) {
      const wasOpen = document.body.classList.contains(cls);
      closePopovers();
      if (!wasOpen) {
        document.body.classList.add(cls);
        document.getElementById(buttonId).setAttribute("aria-expanded", "true");
      }
      return !wasOpen;
    }

    // Applied filter values (what the chips show), set by applyCurrentFilter()
    let appliedFilter = { content: "", tags: [], required: "any" };

    function updateFilterSummary() {
      const chips = document.getElementById("filter-chips");
      const badge = document.getElementById("filter-badge");
      const items = [];
      if (appliedFilter.content) items.push({ key: "content", text: `“${appliedFilter.content}”` });
      appliedFilter.tags.forEach(tag => items.push({ key: "tag", value: tag, text: `#${tag}` }));
      if (appliedFilter.required !== "any") {
        items.push({ key: "required", text: appliedFilter.required === "true" ? "required" : "not required" });
      }
      badge.hidden = items.length === 0;
      badge.textContent = items.length;
      chips.hidden = items.length === 0;
      chips.innerHTML = "";
      items.forEach(item => {
        const chip = document.createElement("button");
        chip.className = "chip";
        chip.title = "Remove this filter";
        chip.innerHTML = `<span></span><span class="material-icons">close</span>`;
        chip.firstChild.textContent = item.text;
        chip.addEventListener("click", e => { e.stopPropagation(); removeFilter(item); });
        chips.appendChild(chip);
      });
      if (items.length) {
        const count = document.createElement("span");
        count.className = "chip-count";
        count.textContent = `${flashcards.length} of ${allFlashcards.length} cards`;
        chips.appendChild(count);
      }
    }

    function removeFilter(item) {
      if (item.key === "content") document.getElementById("search-input").value = "";
      if (item.key === "required") document.getElementById("required-filter").value = "any";
      if (item.key === "tag") {
        const tagInput = document.getElementById("tag-filter");
        tagInput.value = tagInput.value.split(",").map(t => t.trim())
          .filter(t => t !== "" && t.toLowerCase() !== item.value).join(", ");
      }
      applyCurrentFilter();
      renderCard();
    }

    function initCommandBar() {
      const actions = {
        focus: () => toggleFocusMode(),
        theme: () => toggleDarkMode(),
        edit: () => setEditMode(!editMode),
        history: () => { closePopovers(); toggleMistakesHistoryVisibility(); },
        copy: () => { closePopovers(); copyCardContent(); },
        help: () => { closePopovers(); toggleHelp(true); },
        filters: () => {
          const opened = togglePopover("filters-open", "filter-toggle");
          if (opened) {
            document.getElementById("tag-browser-search").value = "";
            renderTagBrowser();
          }
          if (opened && window.innerWidth > 768) {
            setTimeout(() => document.getElementById("search-input").focus(), 50);
          }
        },
        menu: () => togglePopover("menu-open", "menu-toggle"),
      };
      document.querySelectorAll("[data-action]").forEach(btn => {
        btn.addEventListener("click", e => {
          e.stopPropagation();
          actions[btn.dataset.action]();
        });
      });
      document.getElementById("sheet-backdrop").addEventListener("click", closePopovers);
      document.getElementById("help-close").addEventListener("click", () => toggleHelp(false));
      document.getElementById("help-modal").addEventListener("click", e => {
        if (e.target.id === "help-modal") toggleHelp(false);
      });
      // Click outside an open popover closes it
      document.addEventListener("click", e => {
        if (!e.target.closest("#filter-panel, #overflow-menu")) closePopovers();
      });
      // Overflow menu items close the menu after acting
      document.getElementById("clear-attempts").addEventListener("click", closePopovers);
    }

    // Each change is saved with one small API call (the server stores the deck in SQLite).
    function api(method, url, body) {
      return fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: body === undefined ? undefined : JSON.stringify(body)
      })
      .then(response => response.json().then(data => {
        if (!response.ok || !data.success) throw new Error(data.error || `HTTP ${response.status}`);
        return data;
      }))
      .catch(error => {
        console.error(`Save failed: ${method} ${url}`, error);
        alert(`Error saving changes: ${error.message}`);
        return null;
      });
    }

    // Tell the server where a card now sits in the full deck (after its new left neighbour).
    function persistPosition(cardId) {
      const idx = allFlashcards.findIndex(c => c.id === cardId);
      if (idx === -1) return;
      return api("POST", `/api/cards/${cardId}/move`, { after_id: idx > 0 ? allFlashcards[idx - 1].id : null });
    }

    function clearCardAttempts() {
      if (flashcards.length === 0) return;
      const card = flashcards[currentIndex];
      card.attempts = [];
      api("DELETE", `/api/cards/${card.id}/attempts`);
      renderCard();
    }
    
    document.getElementById("clear-attempts").addEventListener("click", function() {
      if (confirm("Are you sure you want to clear all attempt history for this card?")) {
        clearCardAttempts();
      }
    });

    document.getElementById("tag-filter").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        document.getElementById("apply-filter").click();
        document.activeElement.blur();
      }
    });

    document.getElementById("search-input").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        document.getElementById("apply-filter").click();
        document.activeElement.blur();
      }
    });

    // Jump search functionality:
    document.getElementById("jump-search-input").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        let term = this.value.trim().toLowerCase();
        if (term === "") return;
        // If the term is different from the last jump search, recalc the results.
        if (term !== jumpSearchTerm) {
          jumpSearchTerm = term;
          jumpSearchResults = [];
          jumpSearchCurrentIndex = 0;
          flashcards.forEach((card, index) => {
            if (
              card.front.toLowerCase().includes(term) ||
              card.back.toLowerCase().includes(term)
            ) {
              jumpSearchResults.push(index);
            }
          });
          if (jumpSearchResults.length === 0) {
            alert("No card with that content is found.");
            return;
          }
        }
        // Jump to the next matching card.
        if (jumpSearchResults.length > 0) {
          currentIndex = jumpSearchResults[jumpSearchCurrentIndex];
          jumpSearchCurrentIndex = (jumpSearchCurrentIndex + 1) % jumpSearchResults.length;
          renderCard();
        } else {
          alert("No card with that content is found.");
        }
      }
    });

    // ---------- Tag browser ----------
    function selectedFilterTags() {
      return document.getElementById("tag-filter").value.split(",")
        .map(t => t.trim()).filter(t => t !== "");
    }

    function renderTagBrowser() {
      const list = document.getElementById("tag-browser-list");
      const query = document.getElementById("tag-browser-search").value.trim().toLowerCase();
      const selected = new Set(selectedFilterTags().map(t => t.toLowerCase()));
      const counts = new Map(); // lowercased tag -> {name, count}
      allFlashcards.forEach(card => (card.tags || []).forEach(tag => {
        const key = tag.trim().toLowerCase();
        if (!key) return;
        const entry = counts.get(key) || { name: tag.trim(), count: 0 };
        entry.count++;
        counts.set(key, entry);
      }));
      // Selected tags first, then by card count, then alphabetically.
      const tags = [...counts.entries()]
        .filter(([key]) => !query || key.includes(query))
        .sort((a, b) => (selected.has(b[0]) - selected.has(a[0])) ||
                        (b[1].count - a[1].count) || a[0].localeCompare(b[0]));
      list.innerHTML = "";
      if (tags.length === 0) {
        const empty = document.createElement("div");
        empty.className = "tb-empty";
        empty.textContent = counts.size === 0 ? "No cards have tags yet." : "No matching tags.";
        list.appendChild(empty);
        return;
      }
      tags.forEach(([key, { name, count }]) => {
        const label = document.createElement("label");
        label.className = "tb-item";
        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = selected.has(key);
        box.addEventListener("change", () => toggleFilterTag(name, box.checked));
        const text = document.createElement("span");
        text.className = "tb-name";
        text.textContent = name;
        const num = document.createElement("span");
        num.className = "tb-count";
        num.textContent = count;
        label.append(box, text, num);
        list.appendChild(label);
      });
    }

    function toggleFilterTag(name, on) {
      const key = name.toLowerCase();
      const tags = selectedFilterTags().filter(t => t.toLowerCase() !== key);
      if (on) tags.push(name);
      document.getElementById("tag-filter").value = tags.join(", ");
      applyCurrentFilter();
      renderCard();
      renderTagBrowser();
    }

    document.getElementById("tag-filter").addEventListener("input", renderTagBrowser);
    document.getElementById("tag-browser-search").addEventListener("input", renderTagBrowser);
    document.getElementById("tag-browser-search").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        // Enter checks the first unchecked match, so you can filter by keyboard.
        e.preventDefault();
        const first = document.querySelector("#tag-browser-list .tb-item input:not(:checked)");
        if (first) { first.checked = true; first.dispatchEvent(new Event("change")); }
        this.value = "";
        renderTagBrowser();
      }
    });

    function applyCurrentFilter() {
      let filteredCards = allFlashcards.slice();
      const tagInput = document.getElementById("tag-filter").value.trim().toLowerCase();
      if (tagInput !== "") {
        const filterTags = tagInput.split(",").map(tag => tag.trim()).filter(tag => tag !== "");
        filteredCards = filteredCards.filter(card => {
          const cardTags = card.tags.map(tag => tag.toLowerCase());
          return filterTags.every(filterTag => cardTags.includes(filterTag));
        });
      }
      const searchText = document.getElementById("search-input").value.trim().toLowerCase();
      if (searchText !== "") {
        filteredCards = filteredCards.filter(card =>
          card.front.toLowerCase().includes(searchText) ||
          card.back.toLowerCase().includes(searchText)
        );
      }
      
      // Apply the absolutely required filter (NEW)
      const requiredFilter = document.getElementById("required-filter").value;
      if (requiredFilter !== "any") {
        const isRequired = requiredFilter === "true";
        filteredCards = filteredCards.filter(card => 
          card.absolutelyRequired === isRequired
        );
      }
      
      flashcards = filteredCards;
      appliedFilter = {
        content: searchText,
        tags: tagInput === "" ? [] : tagInput.split(",").map(tag => tag.trim()).filter(tag => tag !== ""),
        required: requiredFilter
      };
      updateFilterSummary();
      saveStateToLocalStorage();
      return flashcards;
    }

    // Upload an image file to /upload and resolve with its URL.
    function uploadImage(file) {
      const formData = new FormData();
      formData.append("image", file);
      return fetch("/upload", { method: "POST", body: formData })
        .then(response => response.json())
        .then(data => {
          if (!data.url) throw new Error(data.error || "Image upload failed.");
          return data.url;
        });
    }

    function imageHtml(url) {
      return `<div style="width: 100%; height: 100%;"><img class="embedded-card-image" src="${url}"></div>`;
    }

    // Replace textarea[start, end) with text and put the cursor after it.
    function insertIntoTextarea(textarea, start, end, text) {
      textarea.value = textarea.value.slice(0, start) + text + textarea.value.slice(end);
      textarea.selectionStart = textarea.selectionEnd = start + text.length;
      textarea.dispatchEvent(new Event("input", { bubbles: true }));
    }

    // Upload images and insert them at [start, end), showing a placeholder meanwhile.
    function insertImages(textarea, files, start, end) {
      const placeholder = `[uploading ${files.length > 1 ? files.length + " images" : "image"}…]`;
      insertIntoTextarea(textarea, start, end, placeholder);
      Promise.allSettled(files.map(uploadImage)).then(results => {
        const html = results.filter(r => r.status === "fulfilled").map(r => imageHtml(r.value)).join("");
        const at = textarea.value.indexOf(placeholder);
        if (at === -1) {
          textarea.value += html; // placeholder was edited away: append instead
          textarea.dispatchEvent(new Event("input", { bubbles: true }));
        } else {
          insertIntoTextarea(textarea, at, at + placeholder.length, html);
        }
        const failed = results.filter(r => r.status === "rejected");
        if (failed.length) {
          console.error("Upload error:", failed.map(r => r.reason));
          alert(`${failed.length} image upload${failed.length > 1 ? "s" : ""} failed.`);
        }
      });
    }

    function setupDragDrop(textareaId) {
      const textarea = document.getElementById(textareaId);
      if (!textarea) return;
      textarea.addEventListener("dragover", function(e) {
        e.preventDefault();
      });
      textarea.addEventListener("drop", function(e) {
        e.preventDefault();
        const files = [...e.dataTransfer.files];
        if (files.length === 0) return;
        const images = files.filter(f => f.type.startsWith("image/"));
        if (images.length === 0) {
          alert("Only image files are allowed.");
          return;
        }
        insertImages(textarea, images, textarea.selectionStart, textarea.selectionEnd);
      });
      // Ctrl+V / Cmd+V an image (screenshot, copied image) to upload and embed it.
      textarea.addEventListener("paste", function(e) {
        const items = [...((e.clipboardData && e.clipboardData.items) || [])];
        const images = items.filter(i => i.kind === "file" && i.type.startsWith("image/"))
          .map(i => i.getAsFile()).filter(Boolean)
          .map((f, n) => {
            // Clipboard images are all called "image.png": give each a unique name.
            const ext = (f.type.split("/")[1] || "png").replace(/[^a-z0-9]/gi, "") || "png";
            return new File([f], `pasted-${Date.now()}${n ? "-" + n : ""}.${ext}`, { type: f.type });
          });
        if (images.length === 0) return; // plain text paste: let the browser handle it
        e.preventDefault();
        insertImages(textarea, images, textarea.selectionStart, textarea.selectionEnd);
      });
    }

    function ensureAttemptsExist() {
      allFlashcards.forEach(card => {
        if (!card.attempts) {
          card.attempts = [];
        }
      });
    }

    function getPerformanceStats(card) {
      if (!card.attempts || card.attempts.length === 0) {
        return { percentage: 0, total: 0 };
      }
      const totalAttempts = card.attempts.length;
      const correctAttempts = card.attempts.filter(attempt => attempt.correct).length;
      const percentage = (correctAttempts / totalAttempts) * 100;
      return {
        percentage: percentage.toFixed(2),
        total: totalAttempts
      };
    }

    function recordAttempt(correct, reason = null) {
      if (flashcards.length === 0) return;
      const card = flashcards[currentIndex];
      if (!card.attempts) {
        card.attempts = [];
      }
      
      const attemptData = {
        timestamp: Date.now(),
        correct: correct
      };
      
      // Only add reason if it's provided and not empty
      if (reason) {
        attemptData.reason = reason;
      }
      
      card.attempts.push(attemptData);
      api("POST", `/api/cards/${card.id}/attempts`, attemptData);
      renderCard();
    }

    function renderRequiredStar(card) {
      const star = document.getElementById("required-toggle");
      const on = !!card.absolutelyRequired;
      star.classList.toggle("on", on);
      star.setAttribute("aria-pressed", on ? "true" : "false");
      star.title = on ? "Absolutely required (r to unmark)" : "Mark as absolutely required (r)";
      star.firstElementChild.textContent = on ? "star" : "star_border";
    }

    function toggleRequired() {
      if (flashcards.length === 0) return;
      const card = flashcards[currentIndex];
      card.absolutelyRequired = !card.absolutelyRequired;
      renderRequiredStar(card);
      api("PATCH", `/api/cards/${card.id}`, { absolutelyRequired: card.absolutelyRequired });
      showSaveNotification();
    }

    function timeAgo(ts) {
      const sec = Math.max(0, (Date.now() - ts) / 1000);
      if (sec < 60) return "just now";
      const units = [["y", 31536000], ["mo", 2592000], ["w", 604800], ["d", 86400], ["h", 3600], ["m", 60]];
      for (const [label, size] of units) {
        if (sec >= size) return `${Math.floor(sec / size)}${label} ago`;
      }
    }

    function renderPerformance(card) {
      const el = document.getElementById("performance-stats");
      const attempts = (card.attempts || []).slice().sort((a, b) => a.timestamp - b.timestamp);
      if (attempts.length === 0) {
        el.innerHTML = `<span class="perf-new" title="Never attempted">0 attempts</span>`;
        return;
      }
      const correct = attempts.filter(a => a.correct).length;
      const pct = Math.round((100 * correct) / attempts.length);
      const tier = pct >= 80 ? "high-performance" : pct >= 50 ? "medium-performance" : "low-performance";
      const last = attempts.slice(-5);
      const dots = last.map(a =>
        `<span class="perf-dot${a.correct ? " ok" : ""}" title="${a.correct ? "Correct" : "Incorrect"} · ${new Date(a.timestamp).toLocaleString()}"></span>`).join("");
      el.innerHTML =
        `<span class="perf-dots" title="Last ${last.length} attempts, oldest first">${dots}</span>` +
        `<span>${correct}/${attempts.length}</span><span class="perf-sep">·</span>` +
        `<span class="perf-score ${tier}">${pct}%</span><span class="perf-sep">·</span>` +
        `<span title="Last reviewed ${new Date(attempts[attempts.length - 1].timestamp).toLocaleString()}">${timeAgo(attempts[attempts.length - 1].timestamp)}</span>`;
    }

    function renderTagChips(card) {
      const el = document.getElementById("tags-info");
      el.innerHTML = "";
      (card.tags || []).forEach(tag => {
        const chip = document.createElement("button");
        chip.className = "tag-chip";
        chip.textContent = tag;
        chip.title = `Show only cards tagged “${tag}”`;
        chip.addEventListener("click", e => {
          e.stopPropagation();
          document.getElementById("tag-filter").value = tag;
          applyCurrentFilter();
          const idx = flashcards.findIndex(c => c.id === card.id);
          currentIndex = idx === -1 ? 0 : idx;
          renderCard();
        });
        el.appendChild(chip);
      });
    }

    function autoResizeTextarea(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    }

    function renderIncorrectAttempts() {
      const attemptsList = document.getElementById("incorrect-attempts-list");
      attemptsList.innerHTML = "";
      
      if (flashcards.length === 0) {
        attemptsList.innerHTML = "<p class='no-attempts-message'>No cards matched the filter.</p>";
        return;
      }
      
      const card = flashcards[currentIndex];
      
      if (!card.attempts || card.attempts.length === 0) {
        attemptsList.innerHTML = "<p class='no-attempts-message'>No recorded mistakes for this card.</p>";
        return;
      }
      
      // Filter for incorrect attempts that have a reason
      const incorrectAttempts = card.attempts
        .filter(attempt => !attempt.correct && attempt.reason)
        .sort((a, b) => b.timestamp - a.timestamp); // Sort by timestamp, newest first
      
      if (incorrectAttempts.length === 0) {
        attemptsList.innerHTML = "<p class='no-attempts-message'>No detailed mistake records for this card.</p>";
        return;
      }
      
      incorrectAttempts.forEach((attempt) => {
        const attemptDate = new Date(attempt.timestamp);
        const dateString = attemptDate.toLocaleString(); // Format date/time
        
        const listItem = document.createElement("li");
        listItem.className = "incorrect-attempt-item";
        
        // Create delete button
        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-attempt-button";
        deleteButton.setAttribute("title", "Delete this mistake record");
        deleteButton.setAttribute("data-timestamp", attempt.timestamp); // Store timestamp for identification
        
        // Add Material Icons icon
        const iconSpan = document.createElement("span");
        iconSpan.className = "material-icons";
        iconSpan.textContent = "delete"; // Using the "delete" icon
        deleteButton.appendChild(iconSpan);
        
        deleteButton.addEventListener("click", function(e) {
          e.stopPropagation(); // Prevent event bubbling
          deleteIncorrectAttempt(attempt.timestamp);
        });
        
        const dateElement = document.createElement("div");
        dateElement.className = "incorrect-attempt-date";
        dateElement.textContent = dateString;
        
        const reasonElement = document.createElement("div");
        reasonElement.className = "incorrect-attempt-reason";
        reasonElement.textContent = attempt.reason;
        
        listItem.appendChild(deleteButton);
        listItem.appendChild(dateElement);
        listItem.appendChild(reasonElement);
        attemptsList.appendChild(listItem);
      });
    }
    
    // Function to delete an incorrect attempt
    function deleteIncorrectAttempt(timestamp) {
      if (flashcards.length === 0) return;
      
      const card = flashcards[currentIndex];
      if (!card.attempts) return;
      
      // Find the attempt with the matching timestamp
      const attemptIndex = card.attempts.findIndex(attempt => attempt.timestamp === parseInt(timestamp, 10));
      
      if (attemptIndex !== -1) {
        // Remove the attempt
        card.attempts.splice(attemptIndex, 1);
        
        // Persist the change
        api("DELETE", `/api/cards/${card.id}/attempts/${parseInt(timestamp, 10)}`);
        
        // Re-render the list
        renderIncorrectAttempts();
      }
    }
    
    // Card text is HTML plus a little markdown, typed by a person. formatCardHtml turns it
    // into the HTML that is shown:
    //   1. math (MathJax needs the raw TeX), <pre>, comments and `code` are set aside untouched;
    //   2. markdown lists: lines starting with -, *, + or 1. / 1) (indent to nest);
    //   3. **bold** and *italic*;
    //   4. typed newlines become <br>, except next to tags that already break the line
    //      (<br>, <div>, <li>, ...), so cards written with explicit HTML look as before.
    const BLOCK_TAG = "(?:br|div|p|ol|ul|li|table|thead|tbody|tr|td|th|h[1-6]|hr|pre|blockquote|details|summary)";
    const ENDS_WITH_BLOCK = new RegExp(`<\\/?${BLOCK_TAG}\\b[^>]*>\\s*$`, "i");
    const STARTS_WITH_BLOCK = new RegExp(`^\\s*<\\/?${BLOCK_TAG}\\b`, "i");
    const PROTECTED = /\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\)|\\begin\{([a-z*]+)\}[\s\S]*?\\end\{\1\}|\$(?:\\.|[^$\\])+\$|<pre\b[\s\S]*?<\/pre>|<!--[\s\S]*?-->|`[^`\n]+`/gi;
    const LIST_ITEM = /^([ \t]*)([-*+]|(\d+)[.)])[ \t]+(.*)$/;

    function formatCardHtml(text) {
      if (!text) return "";
      const kept = [];
      const keep = m => `\u0000${kept.push(m[0] === "`" ? `<code>${m.slice(1, -1)}</code>` : m) - 1}\u0000`;
      let html = text.replace(/\r\n?/g, "\n").replace(PROTECTED, keep);
      // A <!-- comment --> alone on its line takes no line of its own (no blank line, no break
      // in a list): it joins the line above, or at the very top the line below.
      const allComments = phs => phs.match(/\d+/g).every(i => kept[+i].startsWith("<!--"));
      html = html
        .replace(/\n[ \t]*(\u0000\d+\u0000)[ \t]*(?=\n|$)/g, (m, ph) => allComments(ph) ? ph : m)
        .replace(/^[ \t]*((?:\u0000\d+\u0000)+)[ \t]*\n/, (m, phs) => allComments(phs) ? phs : m);
      html = renderMarkdownLists(html);
      html = html
        .replace(/\*\*(?=\S)([^\n]*?\S)\*\*/g, "<strong>$1</strong>")
        .replace(/(?<![\w*])\*(?=[^\s*])([^*\n]*?[^\s*])\*(?![\w*])/g, "<em>$1</em>");
      html = html.replace(/[ \t]*\n(?:[ \t]*\n)*[ \t]*/g, (run, offset, all) => {
        const before = all.slice(0, offset), after = all.slice(offset + run.length);
        if (before.trim() === "" || after.trim() === "") return run; // leading/trailing
        if (ENDS_WITH_BLOCK.test(before) || STARTS_WITH_BLOCK.test(after)) return run;
        return "<br>".repeat(run.split("\n").length - 1);
      });
      return html.replace(/\u0000(\d+)\u0000/g, (_, i) => kept[+i]);
    }

    // Runs of list lines become <ul>/<ol>; deeper indentation nests a list in the item above.
    // A line that isn't a list item ends the list.
    function renderMarkdownLists(text) {
      const out = [];
      const open = []; // stack of { indent, tag }
      const closeDeeperThan = indent => {
        while (open.length && open[open.length - 1].indent > indent) out.push(`</li></${open.pop().tag}>`);
      };
      for (const line of text.split("\n")) {
        const m = line.match(LIST_ITEM);
        if (!m) { closeDeeperThan(-1); out.push(line); continue; }
        const indent = m[1].replace(/\t/g, "    ").length;
        const tag = m[3] ? "ol" : "ul";
        const item = m[4].replace(/(?:\s*<br\s*\/?>)+\s*$/i, ""); // a list item already ends the line
        closeDeeperThan(indent);
        const top = open[open.length - 1];
        if (top && top.indent === indent && top.tag === tag) { out.push(`</li><li>${item}`); continue; }
        if (top && top.indent === indent) out.push(`</li></${open.pop().tag}>`); // switched - ↔ 1.
        open.push({ indent, tag });
        const start = tag === "ol" && m[3] !== "1" ? ` start="${+m[3]}"` : "";
        out.push(`<${tag}${start}><li>${item}`);
      }
      closeDeeperThan(-1);
      return out.join("\n");
    }

    function renderCard() {
      if (flashcards.length === 0) {
        document.getElementById("flashcard").innerText = "No cards match the filter.";
        document.getElementById("card-info").innerText = "0 / 0";
        document.getElementById("card-progress-fill").style.width = "0";
        document.getElementById("performance-stats").innerHTML = "";
        document.getElementById("tags-info").innerHTML = "";
        document.getElementById("required-toggle").style.visibility = "hidden";
        document.getElementById("incorrect-attempts-list").innerHTML = "<p class='no-attempts-message'>No cards matched the filter.</p>";
        return;
      }
      document.getElementById("required-toggle").style.visibility = "visible";
      
      if (currentIndex < 0 || currentIndex >= flashcards.length) {
        currentIndex = 0;
      }
      const card = flashcards[currentIndex];
      
      renderRequiredStar(card);
      
      if (editMode) {
        document.getElementById("flashcard").innerHTML = `
          <div style="margin-bottom: 10px;"><label style="font-size: 24px;">Front</label></div>
          <textarea id="edit-front" rows="5" style="resize: vertical; overflow: hidden;" spellcheck="false">${card.front}</textarea><br>
          <div style="margin: 10px 0px;"><label style="font-size: 24px;">Back</label></div>
          <textarea id="edit-back" rows="5" style="resize: vertical; overflow: hidden;" spellcheck="false">${card.back}</textarea><br>
          <div style="margin: 10px 0px;"><label style="font-size: 24px;">Tags</label></div>
          <input type="text" id="edit-tags" value="${card.tags.join(', ')}"><br>
          <div class="card-buttons-outter">
            <div class="card-buttons-inner">
              <button id="save-card-edits">Save</button>
              <button id="copy-card-content" title="Copy Card Content"><i class="material-icons">content_copy</i></button>
            </div>
          </div>
        `;
        setupDragDrop("edit-front");
        setupDragDrop("edit-back");
        const frontTextarea = document.getElementById("edit-front");
        const backTextarea = document.getElementById("edit-back");
        frontTextarea.addEventListener("input", function() {
          autoResizeTextarea(frontTextarea);
        });
        backTextarea.addEventListener("input", function() {
          autoResizeTextarea(backTextarea);
        });
        autoResizeTextarea(frontTextarea);
        autoResizeTextarea(backTextarea);

        document.getElementById("save-card-edits").addEventListener("click", function(e) {
          e.stopPropagation();
          flashcards[currentIndex].front = document.getElementById("edit-front").value;
          flashcards[currentIndex].back = document.getElementById("edit-back").value;
          flashcards[currentIndex].tags = document.getElementById("edit-tags").value.split(',')
            .map(tag => tag.trim())
            .filter(tag => tag.length > 0);
          const edited = flashcards[currentIndex];
          api("PATCH", `/api/cards/${edited.id}`, { front: edited.front, back: edited.back, tags: edited.tags });
          showSaveNotification();
          renderCard();
        });
        
        document.getElementById("copy-card-content").addEventListener("click", function(e) {
          e.stopPropagation();
          copyCardContent();
        });
        
      } else {
        document.getElementById("flashcard").innerHTML = formatCardHtml(showingFront ? card.front : card.back);
      }
      
      // Render the incorrect attempts history
      renderIncorrectAttempts();
      
      // Update the visibility of the mistake history based on mode and card side
      updateMistakesHistoryVisibility();
      
      document.getElementById("card-info").innerText = `${currentIndex + 1} / ${flashcards.length}`;
      document.getElementById("card-progress-fill").style.width = `${(100 * (currentIndex + 1)) / flashcards.length}%`;
      renderPerformance(card);
      renderTagChips(card);
      if (window.MathJax) {
        if (typeof MathJax.typesetPromise === "function") {
          MathJax.typesetPromise();
        } else if (typeof MathJax.typeset === "function") {
          MathJax.typeset();
        }
      }
      saveStateToLocalStorage();
    }

    // Mobile touch and UI handlers
    function initMobileHandlers() {
      // Touch variables for swipe detection
      let touchStartX = 0;
      let touchEndX = 0;
      let touchStartY = 0;
      let touchEndY = 0;
      
      // Minimum distance for a swipe
      const minSwipeDistance = 50;
      
      // Add touch event handlers to the flashcard
      const flashcard = document.getElementById("flashcard");
      
      // Track if it's a tap or a swipe
      let isTap = false;
      let touchStartTime = 0;
      
      flashcard.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
        touchStartTime = new Date().getTime();
        isTap = true;
      });
      
      flashcard.addEventListener('touchmove', e => {
        // If moved more than a small threshold, it's not a tap
        const moveX = Math.abs(e.changedTouches[0].screenX - touchStartX);
        const moveY = Math.abs(e.changedTouches[0].screenY - touchStartY);
        if (moveX > 10 || moveY > 10) {
          isTap = false;
        }
      });
      
      flashcard.addEventListener('touchend', e => {
        // Editing: touches are for the text boxes, not for flipping or changing cards
        if (editMode) return;
        touchEndX = e.changedTouches[0].screenX;
        touchEndY = e.changedTouches[0].screenY;
        const touchEndTime = new Date().getTime();
        
        // Calculate horizontal distance
        const deltaX = touchEndX - touchStartX;
        const deltaY = touchEndY - touchStartY;
        
        // Check if it's a tap (short duration, minimal movement)
        if (isTap && touchEndTime - touchStartTime < 300) {
          // It's a tap - flip the card
          showingFront = !showingFront;
          renderCard(); // This will now call updateMistakesHistoryVisibility
          return;
        }
        
        // Check if horizontal swipe is more significant than vertical
        if (Math.abs(deltaX) > Math.abs(deltaY)) {
          // Check if it's a left or right swipe (with minimum distance)
          if (Math.abs(deltaX) > minSwipeDistance) {
            if (deltaX > 0) {
              // Right swipe - previous card
              if (currentIndex > 0) {
                currentIndex--;
                showingFront = true;
                renderCard();
                saveStateToLocalStorage();
              }
            } else {
              // Left swipe - next card
              if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                showingFront = true;
                renderCard();
                saveStateToLocalStorage();
              }
            }
          }
        }
      });
      
      // Mobile action buttons
      document.getElementById("mobile-prev").addEventListener("click", function() {
        if (!editMode && currentIndex > 0) {
          currentIndex--;
          showingFront = true;
          renderCard();
          saveStateToLocalStorage();
        }
      });
      
      document.getElementById("mobile-next").addEventListener("click", function() {
        if (!editMode && currentIndex < flashcards.length - 1) {
          currentIndex++;
          showingFront = true;
          renderCard();
          saveStateToLocalStorage();
        }
      });
      
      document.getElementById("mobile-correct").addEventListener("click", function() {
        if (!editMode && flashcards.length > 0) {
          recordAttempt(true);
          // Advance to next card after marking correct
          if (currentIndex < flashcards.length - 1) {
            currentIndex++;
            showingFront = true;
            renderCard();
            saveStateToLocalStorage();
          }
        }
      });
      
      document.getElementById("mobile-incorrect").addEventListener("click", function() {
        if (!editMode && flashcards.length > 0) {
          showIncorrectModal();
        }
      });
      
      initCommandBar();
    }

    document.getElementById("add-card").addEventListener("click", function() {
      const tagInput = document.getElementById("tag-filter").value.trim();
      const defaultTags = tagInput ? tagInput.split(",").map(tag => tag.trim()).filter(tag => tag !== "") : [];
      
      // Get the current "Absolutely Required" filter value
      const requiredFilter = document.getElementById("required-filter").value;
      // Set the new card's absolutelyRequired property based on current filter
      const isAbsolutelyRequired = requiredFilter === "true";
      
      // Create the new card with a unique timestamp ID
      const newCard = {
        "id": Date.now(),
        "front": "TODO: New front content",
        "back": "TODO: New back content",
        "tags": defaultTags,
        "understanding": 1,
        "absolutelyRequired": isAbsolutelyRequired, // Now dynamic based on filter
        "attempts": []
      };
      
      if (flashcards.length > 0) {
        // Get the current card's ID
        const currentCardId = flashcards[currentIndex].id;
        
        // Find its position in the full card list
        const masterIndex = allFlashcards.findIndex(card => card.id === currentCardId);

        console.log("currentCardId: ", currentCardId);
        console.log("masterIndex: ", masterIndex);
        
        if (masterIndex !== -1) {
          // Insert new card after current card in master list
          allFlashcards.splice(masterIndex + 1, 0, newCard);
          
          // Check if we're in a filtered view
          const isFiltered = tagInput !== "" || 
                          document.getElementById("search-input").value.trim() !== "" ||
                          document.getElementById("required-filter").value !== "any";
          
          if (isFiltered) {
            // For filtered views, check if the new card will be visible with current filters
            
            // First, store the current filter state
            const currentTagFilter = document.getElementById("tag-filter").value;
            const currentSearchFilter = document.getElementById("search-input").value;
            const currentRequiredFilter = document.getElementById("required-filter").value;
            
            // Apply current filters to see if new card is included
            const filteredWithNewCard = applyCurrentFilter();
            const newCardIndex = filteredWithNewCard.findIndex(card => card.id === newCard.id);
            
            if (newCardIndex !== -1) {
              // New card is visible in current filter, set current index to it
              currentIndex = newCardIndex;
            } else {
              // New card is not visible in current filter
              const userWantsToClearFilters = confirm("The new card doesn't match your current filters. Would you like to clear filters to see it?");
              
              if (userWantsToClearFilters) {
                // Clear filters and show the new card
                document.getElementById("tag-filter").value = "";
                document.getElementById("search-input").value = "";
                document.getElementById("required-filter").value = "any";
                
                // Apply empty filter to get all cards
                flashcards = allFlashcards.slice();
                
                // Find the new card in the full list
                currentIndex = flashcards.findIndex(card => card.id === newCard.id);
              }
              // If user doesn't want to clear filters, keep current position
            }
          } else {
            // For unfiltered view, we can directly set the index to the inserted position
            flashcards = allFlashcards.slice(); // Ensure flashcards is up to date
            currentIndex = masterIndex + 1; // Set to the position right after the current card
          }
        } else {
          // Fallback if card ID not found (shouldn't happen)
          allFlashcards.push(newCard);
          flashcards = allFlashcards.slice();
          currentIndex = flashcards.length - 1;
        }
      } else {
        // No cards in current view
        allFlashcards.push(newCard);
        
        // Clear any filters
        document.getElementById("tag-filter").value = "";
        document.getElementById("search-input").value = "";
        document.getElementById("required-filter").value = "any";
        
        // Update flashcards array
        flashcards = allFlashcards.slice();
        currentIndex = flashcards.length - 1;
      }
      
      // Save the new card right after its left neighbour in the full deck
      const newIdx = allFlashcards.findIndex(c => c.id === newCard.id);
      api("POST", "/api/cards", { card: newCard, after_id: newIdx > 0 ? allFlashcards[newIdx - 1].id : null })
        .then(data => {
          // The server picks a new id if this one is already taken
          if (data && data.card && data.card.id !== newCard.id) newCard.id = data.card.id;
        });
      renderCard();
      saveStateToLocalStorage();
    });

    document.getElementById("delete-card").addEventListener("click", function() {
      if (flashcards.length === 0) return;
      if (!confirm("Are you sure you want to delete this card?")) return;
      const cardId = flashcards[currentIndex].id;
      allFlashcards = allFlashcards.filter(card => card.id !== cardId);
      const savedCurrentIdx = currentIndex;
      applyCurrentFilter();
      currentIndex = savedCurrentIdx;
      if (currentIndex >= flashcards.length) {
        currentIndex = flashcards.length - 1;
      }
      api("DELETE", `/api/cards/${cardId}`);
      renderCard();
      saveStateToLocalStorage();
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === "Escape") {
        if (document.getElementById("help-modal").style.display === "block") {
          toggleHelp(false);
          e.preventDefault();
          return;
        }
        if (document.body.classList.contains("filters-open") || document.body.classList.contains("menu-open")) {
          closePopovers();
          if (document.activeElement) document.activeElement.blur();
          e.preventDefault();
          return;
        }
        if (document.activeElement && document.activeElement !== document.body) {
          document.activeElement.blur();
          e.preventDefault();
          return;
        }
      }
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
        // When in text fields, let default keyboard shortcuts work normally
        // Don't intercept Cmd+Z, Cmd+C, etc. in text fields
        return;
      }
      
      // Handle Cmd+C/Ctrl+C copy shortcut first
      if ((e.metaKey || e.ctrlKey) && e.key === "c") {
        e.preventDefault();
        copyCardContent();
        return;
      }
      
      // Other modified keys belong to the browser (e.g. Cmd+R must reload, not toggle "required")
      if (e.metaKey || e.altKey || (e.ctrlKey && e.key !== "r")) return;

      // Help panel
      if (e.key === "?") {
        e.preventDefault();
        toggleHelp();
        return;
      }

      // Reordering keyboard shortcuts
      if (flashcards.length > 0 && e.key === "m") {
        e.preventDefault();
        showMoveToModal();
        return;
      }
      
      if (e.key === "f") {
        toggleFocusMode();
        return;
      }
      if (e.key === "t") {
        toggleDarkMode();
        return;
      }
      if (e.key === "h") {
        toggleMistakesHistoryVisibility();
        return;
      }
      if (!editMode) {
        if (e.key === "c") {
          recordAttempt(true);
          // Advance to next card after marking correct
          if (currentIndex < flashcards.length - 1) {
            currentIndex++;
            showingFront = true;
            renderCard();
            saveStateToLocalStorage();
          }
          return;
        } else if (e.key === "x") {
          // Show the incorrect answer modal instead of immediately marking incorrect
          showIncorrectModal();
          return;
        }
      }
      if (e.key === "e") {
        setEditMode(!editMode);
        return;
      }
      if (e.key === "r" && e.ctrlKey) {
        e.preventDefault(); // otherwise the browser reloads the page too
        if (flashcards.length === 0) return;
        if (confirm("Are you sure you want to clear all attempt history for this card?")) {
          clearCardAttempts();
        }
        return;
      }
      if (e.key === "a" && editMode) {
        const addButton = document.getElementById("add-card");
        if (addButton) {
          addButton.click();
        }
        return;
      }
      if (e.key === "d" && editMode) {
        document.getElementById("delete-card").click();
        return;
      }
      if (e.key === "s" && editMode) {
        const saveButton = document.getElementById("save-card-edits");
        if (saveButton) {
          saveButton.click();
        }
        return;
      }
      if (e.key === "r") {
        toggleRequired();
        return;
      }
      if (flashcards.length === 0) return;
      if (e.key === "ArrowRight") {
        if (currentIndex < flashcards.length - 1) {
          currentIndex++;
          showingFront = true;
          renderCard();
          saveStateToLocalStorage();
        }
      } else if (e.key === "ArrowLeft") {
        if (currentIndex > 0) {
          currentIndex--;
          showingFront = true;
          renderCard();
          saveStateToLocalStorage();
        }
      } else if (e.key === " " || e.key === "ArrowUp" || e.key === "ArrowDown") {
        if (!editMode) {
          e.preventDefault();
          showingFront = !showingFront;
          renderCard();
        }
      }
    });

    document.getElementById("apply-filter").addEventListener("click", function() {
      closePopovers();
      applyCurrentFilter();
      renderCard();
      saveStateToLocalStorage();
    });

    document.getElementById("clear-filter").addEventListener("click", function() {
      document.getElementById("tag-filter").value = "";
      document.getElementById("search-input").value = "";
      document.getElementById("required-filter").value = "any"; // Reset required filter (NEW)
      closePopovers();
      applyCurrentFilter();
      renderCard();
      saveStateToLocalStorage();
    });

    document.getElementById("tag-filter").addEventListener("change", function() {
      saveStateToLocalStorage();
    });
    
    document.getElementById("search-input").addEventListener("change", function() {
      saveStateToLocalStorage();
    });
    
    // Add change event for required filter (NEW)
    document.getElementById("required-filter").addEventListener("change", function() {
      saveStateToLocalStorage();
    });

    const saveNotification = document.createElement('div');
    saveNotification.className = 'save-notification';
    saveNotification.textContent = 'Changes saved successfully!';
    saveNotification.style.display = 'none';
    document.body.appendChild(saveNotification);

    function showSaveNotification() {
      saveNotification.style.display = 'block';
      saveNotification.classList.add('show');
      setTimeout(() => {
        saveNotification.classList.remove('show');
        setTimeout(() => {
          saveNotification.style.display = 'none';
        }, 300);
      }, 2000);
    }

    // Add the copyCardContent function to the JavaScript section
    function copyCardContent() {
      if (flashcards.length === 0) return;
      
      const card = flashcards[currentIndex];
      let frontContent, backContent;
      
      if (editMode) {
        // In edit mode, get content from the edit fields
        frontContent = document.getElementById("edit-front").value;
        backContent = document.getElementById("edit-back").value;
      } else {
        // In view mode, get content from the current card object
        frontContent = card.front;
        backContent = card.back;
      }
      
      const textToCopy = `Card Front:
\`\`\`html
${frontContent}
\`\`\`

Card Back:
\`\`\`html
${backContent}
\`\`\`
`;
      
      navigator.clipboard.writeText(textToCopy)
        .then(() => {
          showCopyNotification();
        })
        .catch(err => {
          console.error('Failed to copy content: ', err);
        });
    }

    // Add the showCopyNotification function
    function showCopyNotification() {
      const notification = document.createElement('div');
      notification.className = 'save-notification';
      notification.innerText = 'Card copied to clipboard!';
      document.body.appendChild(notification);
      
      setTimeout(() => {
        notification.classList.add('show');
        setTimeout(() => {
          notification.classList.remove('show');
          setTimeout(() => {
            document.body.removeChild(notification);
          }, 300);
        }, 2000);
      }, 10);
    }

    // Add setup for move to modal
    function setupMoveToModal() {
      const modal = document.getElementById("move-to-modal");
      const submitBtn = document.getElementById("move-to-submit");
      const cancelBtn = document.getElementById("move-to-cancel");
      const input = document.getElementById("move-to-position");

      submitBtn.addEventListener("click", function() {
        const position = parseInt(input.value.trim());
        if (isNaN(position) || position < 1 || position > flashcards.length) {
          alert(`Please enter a valid position between 1 and ${flashcards.length}`);
          return;
        }
        moveCardToPosition(position - 1); // Convert from 1-indexed UI to 0-indexed array
      });

      cancelBtn.addEventListener("click", function() {
        closeMoveToModal();
      });

      // Allow pressing Enter to submit
      input.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
          e.preventDefault();
          submitBtn.click();
        }
      });

      // Close modal if clicking outside
      window.addEventListener("click", function(e) {
        if (e.target === modal) {
          closeMoveToModal();
        }
      });
    }

    function showMoveToModal() {
      const modal = document.getElementById("move-to-modal");
      const input = document.getElementById("move-to-position");
      
      // Use the filtered view length and position, not the master list
      input.value = currentIndex + 1; // Show 1-indexed position in current filtered view
      input.min = 1;
      input.max = flashcards.length; // Max is the length of filtered cards
      
      // Change modal title to make it clear we're moving in the filtered view
      const isFiltered = flashcards.length !== allFlashcards.length;
      const modalTitle = document.querySelector("#move-to-modal .modal-title");
      modalTitle.textContent = isFiltered 
          ? "Move card to position (in current filtered view):" 
          : "Move card to position:";
      
      modal.style.display = "block";
      setTimeout(() => input.focus(), 100);
    }

    function closeMoveToModal() {
      const modal = document.getElementById("move-to-modal");
      modal.style.display = "none";
    }

    // Function to move the current card up one position
    function moveCardUp() {
      if (flashcards.length === 0 || currentIndex === 0) return;
      
      const cardId = flashcards[currentIndex].id;
      const masterIndex = allFlashcards.findIndex(card => card.id === cardId);
      
      if (masterIndex > 0) {
        // Swap with the card above it
        const temp = allFlashcards[masterIndex];
        allFlashcards[masterIndex] = allFlashcards[masterIndex - 1];
        allFlashcards[masterIndex - 1] = temp;
        
        // Re-apply filter to update flashcards array
        const savedIndex = currentIndex;
        applyCurrentFilter();
        
        // Find the new position of the card in filtered view
        const newIndex = flashcards.findIndex(card => card.id === cardId);
        if (newIndex !== -1) {
          currentIndex = newIndex;
        } else {
          // If card is no longer in filtered view, revert to saved index
          currentIndex = savedIndex;
        }
        
        persistPosition(cardId);
        renderCard();
        showMoveNotification("Card moved up");
      }
    }

    // Function to move the current card down one position
    function moveCardDown() {
      if (flashcards.length === 0) return;
      
      const cardId = flashcards[currentIndex].id;
      const masterIndex = allFlashcards.findIndex(card => card.id === cardId);
      
      // Check if this is the last card in the master list
      if (masterIndex >= allFlashcards.length - 1) return;
      
      // Swap with the card below it
      const temp = allFlashcards[masterIndex];
      allFlashcards[masterIndex] = allFlashcards[masterIndex + 1];
      allFlashcards[masterIndex + 1] = temp;
      
      // Re-apply filter to update flashcards array
      const savedIndex = currentIndex;
      applyCurrentFilter();
      
      // Find the new position of the card in filtered view
      const newIndex = flashcards.findIndex(card => card.id === cardId);
      if (newIndex !== -1) {
        currentIndex = newIndex;
      } else {
        // If card is no longer in filtered view, revert to saved index
        currentIndex = savedIndex;
      }
      
      persistPosition(cardId);
      renderCard();
      showMoveNotification("Card moved down");
    }

    // Function to move the current card to a specific position in the filtered view
    function moveCardToPosition(newFilteredPosition) {
      if (flashcards.length === 0 || 
          newFilteredPosition < 0 || 
          newFilteredPosition >= flashcards.length) return;
      
      const cardId = flashcards[currentIndex].id;
      const masterIndex = allFlashcards.findIndex(card => card.id === cardId);
      
      // Find where in the master list to insert the card
      let targetMasterIndex;
      
      if (newFilteredPosition === 0) {
        // If moving to first position in filtered view, find master index of first filtered card
        if (flashcards.length > 0) {
          const firstFilteredCardId = flashcards[0].id;
          const firstFilteredCardMasterIndex = allFlashcards.findIndex(card => card.id === firstFilteredCardId);
          targetMasterIndex = firstFilteredCardMasterIndex;
        } else {
          // If no cards in filtered view (shouldn't happen), just use position 0
          targetMasterIndex = 0;
        }
      } else if (newFilteredPosition === flashcards.length - 1) {
        // If moving to last position, find master index of last filtered card + 1
        // Special case: if we're already the last card, we can't determine position this way
        if (currentIndex === flashcards.length - 1) {
          // We're already the last card - no need to move
          closeMoveToModal();
          return;
        }
        
        const lastFilteredCardId = flashcards[flashcards.length - 1].id;
        const lastFilteredCardMasterIndex = allFlashcards.findIndex(card => card.id === lastFilteredCardId);
        targetMasterIndex = lastFilteredCardMasterIndex + 1;
      } else {
        // If moving to middle position, find master index of card at position and insert after it
        const previousFilteredCardId = flashcards[newFilteredPosition].id;
        const previousFilteredCardMasterIndex = allFlashcards.findIndex(card => card.id === previousFilteredCardId);
        targetMasterIndex = previousFilteredCardMasterIndex + 1;
      }
      
      // Don't move if target position is the same as current position
      if (targetMasterIndex === masterIndex) {
        closeMoveToModal();
        return;
      }
      
      // If moving backward, adjust for the removal of the card from its current position
      if (targetMasterIndex > masterIndex) {
        targetMasterIndex--;
      }
      
      // Remove card from current position
      const cardToMove = allFlashcards.splice(masterIndex, 1)[0];
      
      // Insert at new position
      allFlashcards.splice(targetMasterIndex, 0, cardToMove);
      
      // Re-apply filter to update flashcards array
      applyCurrentFilter();
      
      // Find the new position of the card in filtered view
      const newIndex = flashcards.findIndex(card => card.id === cardId);
      if (newIndex !== -1) {
        currentIndex = newIndex;
        persistPosition(cardId);
        renderCard();
        
        // Show a notification that indicates we moved within the filtered view
        const isFiltered = flashcards.length !== allFlashcards.length;
        const message = isFiltered 
            ? `Card moved to position ${newFilteredPosition + 1} in filtered view` 
            : `Card moved to position ${newFilteredPosition + 1}`;
        showMoveNotification(message);
      } else {
        // If card is no longer in filtered view after moving, alert user
        persistPosition(cardId);
        alert("Card moved but is no longer visible in the current filter.");
      }
      
      closeMoveToModal();
    }

    // Show notification when card is moved
    function showMoveNotification(message) {
      const notification = document.createElement('div');
      notification.className = 'save-notification';
      notification.textContent = message;
      notification.style.display = 'none';
      document.body.appendChild(notification);
      
      setTimeout(() => {
        notification.style.display = 'block';
        notification.classList.add('show');
        setTimeout(() => {
          notification.classList.remove('show');
          setTimeout(() => {
            document.body.removeChild(notification);
          }, 300);
        }, 2000);
      }, 10);
    }
  </script>
